name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/
          cp *.png www/ 2>/dev/null || true
          cp *.gif www/ 2>/dev/null || true

      - name: Install Capacitor & Setup iOS
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/ios @capacitor/cli
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          npx cap add ios

      - name: Fix iOS Deployment Target
        run: |
          if [ -f ios/App/Podfile ]; then
            perl -0pi -e "s/platform :ios, '[^']+'/platform :ios, '14.0'/g" ios/App/Podfile
            echo "✓ Updated Podfile platform target"
          fi

          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            perl -0pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = [^;]+;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g" ios/App/App.xcodeproj/project.pbxproj
            echo "✓ Updated Xcode project deployment target"
          fi

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir Payload
          cp -R App.app Payload/
          zip -r ../../../NRMN2AI.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: NRMN2AI.ipa
