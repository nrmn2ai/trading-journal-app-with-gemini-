name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

- name: Fix iOS deployment target
  shell: bash
  run: |
    cd ios/App

    if [ -f Podfile ]; then
      perl -0pi -e "s/platform :ios, '[^']+'/platform :ios, '14.0'/g" Podfile
      grep -n "platform :ios" Podfile || true
    fi

    if [ -f App.xcodeproj/project.pbxproj ]; then
      perl -0pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = [^;]+;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g" App.xcodeproj/project.pbxproj
      grep -n "IPHONEOS_DEPLOYMENT_TARGET" App.xcodeproj/project.pbxproj | head || true
    fi

    pod install --repo-update

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p temp_www
          cp -R * temp_www/ 2>/dev/null || true
          mv temp_www www
          mv www/Index.html www/index.html 2>/dev/null || true

      - name: Install Cordova & Create Project
        run: |
          # نصب Cordova برای حذف کامل نیاز به CocoaPods
          npm install -g cordova
          cordova create ios_app com.nrmn2ai.terminal "NRMN2AI"
          
          # انتقال تمام فایل‌های داشبورد شما به درون اپلیکیشن
          rm -rf ios_app/www/*
          cp -R www/* ios_app/www/

      - name: Add iOS Platform
        run: |
          cd ios_app
          # ساخت پلتفرم iOS بدون درگیر شدن با پکیج‌های اینترنتی اپل
          cordova platform add ios

      - name: Build iOS App (Unsigned)
        run: |
          cd ios_app/platforms/ios
          # کامپایل مستقیم و سریع توسط خود Xcode
          xcodebuild clean build -project NRMN2AI.xcodeproj -scheme NRMN2AI -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios_app/platforms/ios/build
          mkdir -p Payload
          cp -R NRMN2AI.app Payload/
          zip -r "$GITHUB_WORKSPACE/NRMN2AI.ipa" Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: NRMN2AI.ipa
