name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p temp_www
          cp -R * temp_www/ 2>/dev/null || true
          mv temp_www www
          mv www/Index.html www/index.html 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/ios@6 @capacitor/cli@6
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www

      - name: Add iOS Platform (Ignore Pod Errors)
        continue-on-error: true
        run: |
          # این مرحله ممکن است ارور بدهد، اما گیت‌هاب آن را نادیده می‌‌گیرد و متوقف نمی‌شود
          npx cap add ios

      - name: Fix iOS Deployment Target & Install Pods
        run: |
          cd ios/App
          # تغییر تضمینی نسخه iOS به 15.0 در تنظیمات پادها و ایکس‌کد
          sed -i '' -e "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" Podfile
          sed -i '' -e "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" App.xcodeproj/project.pbxproj
          
          # نصب دستی و موفقیت‌آمیز پادها پس از رفع مشکل
          pod install --repo-update

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r ../../../NRMN2AI.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: NRMN2AI.ipa
