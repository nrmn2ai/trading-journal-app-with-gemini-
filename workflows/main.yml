name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    # استفاده از سیستم‌عامل پایدارتر برای جلوگیری از ارورهای خروجی
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p temp_www
          cp -R * temp_www/ 2>/dev/null || true
          mv temp_www www
          mv www/Index.html www/index.html 2>/dev/null || true

      - name: Install Capacitor & Setup iOS
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/ios @capacitor/cli
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          
          # ساخت پروژه iOS (در صورت بروز خطای اولیه، متوقف نمی‌شود)
          npx cap add ios || true
          
          # حل قطعی خطای CocoaPods با ارتقای اجباری نسخه هدف به iOS 15.0
          cd ios/App
          sed -i '' "s/'13.0'/'15.0'/g" Podfile
          sed -i '' "s/'14.0'/'15.0'/g" Podfile
          sed -i '' "s/13.0/15.0/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/14.0/15.0/g" App.xcodeproj/project.pbxproj
          
          # نصب موفقیت‌آمیز پادها روی نسخه اصلاح‌شده
          pod install

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r ../../../NRMN2AI.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: NRMN2AI.ipa
