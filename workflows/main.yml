name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p temp_www
          cp -R * temp_www/ 2>/dev/null || true
          mv temp_www www
          mv www/Index.html www/index.html 2>/dev/null || true

      - name: Install Capacitor & Patch Template
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/ios@5 @capacitor/cli@5
          
          echo "--- پچ کردن قالب پایه Capacitor پیش از ساخت پروژه ---"
          # تغییر اجباری نسخه سیستم‌عامل در فایل‌های الگو قبل از اجرای بیلد
          find node_modules/@capacitor/ios -type f -name "Podfile" -exec sed -i '' "s/platform :ios.*/platform :ios, '15.0'/g" {} +
          find node_modules/@capacitor/ios -type f -name "project.pbxproj" -exec sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" {} +
          
          # ساخت پروژه با فایل‌های اصلاح‌شده
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          npx cap add ios

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r ../../../NRMN2AI.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: NRMN2AI.ipa
