name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p temp_www
          cp -R * temp_www/ 2>/dev/null || true
          mv temp_www www
          mv www/Index.html www/index.html 2>/dev/null || true

      - name: Install Capacitor & Setup iOS
        run: |
          npm init -y
          # قفل کردن نسخه‌ها روی ورژن ۶ برای جلوگیری از تداخل
          npm install @capacitor/core@6 @capacitor/ios@6 @capacitor/cli@6
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          
          # ایجاد پوشه iOS (اگر پادها اینجا ارور بدهند، پروسه متوقف نمی‌‌شود)
          npx cap add ios || echo "Pod install failed initially, patching target..."
          
          # ارتقای اجباری و هوشمندانه تارگت به iOS 15 در تمامی فایل‌های اپل
          cd ios/App
          sed -i '' -e "s/platform :ios.*/platform :ios, '15.0'/" Podfile
          sed -i '' -e "s/IPHONEOS_DEPLOYMENT_TARGET.*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/" App.xcodeproj/project.pbxproj
          
          # نصب مجدد پادها روی نسخه اصلاح‌شده
          pod install --repo-update

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r ../../../NRMN2AI.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: NRMN2AI.ipa
