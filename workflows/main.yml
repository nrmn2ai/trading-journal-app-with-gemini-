name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p temp_www
          cp -R * temp_www/ 2>/dev/null || true
          mv temp_www www
          mv www/Index.html www/index.html 2>/dev/null || true

      - name: Install Capacitor & Setup iOS
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/ios@6 @capacitor/cli@6
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          
          # ساخت فولدر iOS (اگر پادها ارور دادند، پروسه متوقف نشود تا ما اصلاحش کنیم)
          npx cap add ios || echo "Initial pod install failed, applying force-patch..."
          
          cd ios/App
          
          # بازنویسی کامل فایل تنظیمات اپل (Podfile) و تنظیم اجباری روی iOS 15.0
          cat << 'EOF' > Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'
          platform :ios, '15.0'
          use_frameworks!
          target 'App' do
            capacitor_pods
          end
          post_install do |installer|
            capacitor_post_install(installer)
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          EOF
          
          # تغییر کدهای داخلی Xcode به iOS 15.0
          sed "s/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" App.xcodeproj/project.pbxproj > proj.new && mv proj.new App.xcodeproj/project.pbxproj
          
          # نصب موفقیت‌آمیز پکیج‌های اپل روی فایل اصلاح‌شده
          pod install --repo-update

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r ../../../NRMN2AI.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: NRMN2AI.ipa
