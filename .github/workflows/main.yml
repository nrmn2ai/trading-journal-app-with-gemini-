name: Build iOS IPA & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Native iOS App
        run: |
          xcodebuild clean build \
            -project NRMN2AI.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build

          # Prepare output folder
          mkdir -p $GITHUB_WORKSPACE/output
          cp -R build/App.app $GITHUB_WORKSPACE/output/

      - name: Package to IPA
        run: |
          cd output
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r "$GITHUB_WORKSPACE/NRMN2AI.ipa" Payload/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NRMN2AI.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: "NRMN2AI Native iOS App v1.0.${{ github.run_number }}"
          body: "Native Swift/SwiftUI build for NRMN2AI trading journal app."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
