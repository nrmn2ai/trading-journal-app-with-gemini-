name: Build iOS IPA & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Clean Web Assets
        run: |
          # ساخت پوشه تمیز برای وب‌اپلیکیشن
          mkdir -p www
          
          # کپی کردن فایل‌های اصلی پروژه (فقط فایل‌های وب و سورس کد شما)
          # از کپی کردن پوشه‌های سیستم‌عامل، گیت و پوشه‌های موقت جلوگیری می‌کنیم
          find . -maxdepth 1 ! -name '.' ! -name 'index.html' ! -name '*.html' ! -name '*.js' ! -name '*.css' ! -name 'src' ! -name 'public' ! -name 'assets' ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
          
          # انتقال یا کپی فایل‌های وب به داخل پوشه www
          if [ -d "src" ]; then
            cp -R src/* www/ 2>/dev/null || true
          fi
          if [ -d "public" ]; then
            cp -R public/* www/ 2>/dev/null || true
          fi
          # اگر index.html در ریشه باشد
          cp index.html www/ 2>/dev/null || true

      - name: Install Capacitor & Add Platform
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/ios@5 @capacitor/cli@5
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          npx cap add ios

      - name: Update Target Version & Run Pods
        run: |
          cd ios/App
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/g" Podfile
          pod install --repo-update

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r "$GITHUB_WORKSPACE/NRMN2AI.ipa" Payload/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NRMN2AI.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: "NRMN2AI iOS App v1.0.${{ github.run_number }}"
          body: "Clean build for NRMN2AI trading journal app."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
