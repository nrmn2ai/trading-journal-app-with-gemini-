name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/
          elif [ -f "Index.html" ]; then
            cp "Index.html" www/index.html
          else
            echo "ERROR: No HTML file found!"
            exit 1
          fi

          cp *.png www/ 2>/dev/null || true
          cp *.gif www/ 2>/dev/null || true

          echo "Web assets prepared:"
          ls -la www/

      - name: Initialize NPM
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/ios @capacitor/cli

      - name: Initialize Capacitor
        run: |
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www

      - name: Add iOS Platform
        run: |
          npx cap add ios

      - name: Sync Capacitor
        run: |
          npx cap sync ios || true

      - name: Fix iOS Deployment Target
        shell: bash
        run: |
          cd ios/App

          if [ -f Podfile ]; then
            sed -i '' "s/platform :ios, '[^']*'/platform :ios, '14.0'/g" Podfile
            echo "Updated Podfile to iOS 14.0"
          fi

          if [ -f App.xcodeproj/project.pbxproj ]; then
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [^;]*/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" App.xcodeproj/project.pbxproj
            echo "Updated Xcode deployment target to iOS 14.0"
          fi

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r ../../../NRMN2AI.ipa Payload/
          ls -lh ../../../NRMN2AI.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: NRMN2AI.ipa
          retention-days: 30
