name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp -R * www/ 2>/dev/null || true
          rm -rf www/ios www/.github www/node_modules 2>/dev/null || true

      - name: Install Capacitor & Add Platform
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/ios@5 @capacitor/cli@5
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          npx cap add ios

      - name: Update Target Version & Run Pods
        run: |
          cd ios/App
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/g" Podfile
          pod install --repo-update

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.app Payload/
          # ذخیره مستقیم فایل در پوشه اصلی پروژه با مسیر مطلق
          zip -r "$GITHUB_WORKSPACE/NRMN2AI.ipa" Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: ${{ github.workspace }}/NRMN2AI.ipa
