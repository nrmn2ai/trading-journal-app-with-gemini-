name: Build iOS IPA & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Standard Web Directory
        run: |
          # ساخت یک پروژه کاملاً مجزا و تمیز با پوشه استاندارد www
          mkdir -p capacitor-app/www
          
          # کپی کردن تمام فایل‌های وب شما به داخل این پوشه اختصاصی
          cp index.html capacitor-app/www/
          cp -i *.png capacitor-app/www/ 2>/dev/null || true
          cp -i *.gif capacitor-app/www/ 2>/dev/null || true
          cp -i *.jpg capacitor-app/www/ 2>/dev/null || true
          cp -i *.js capacitor-app/www/ 2>/dev/null || true
          cp -i *.css capacitor-app/www/ 2>/dev/null || true

      - name: Initialize Capacitor
        run: |
          cd capacitor-app
          npm init -y
          npm install @capacitor/core@5 @capacitor/ios@5 @capacitor/cli@5
          
          # مقداردهی کاپاسیتور با اشاره مستقیم به پوشه www
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          npx cap add ios

      - name: Build iOS App
        run: |
          cd capacitor-app/ios/App
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/g" Podfile
          pod install --repo-update
          
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          # استخراج هوشمند فایل خروجی 
          APP_PATH=$(find . -name "App.app" -type d | head -n 1)
          mkdir -p $GITHUB_WORKSPACE/Payload
          cp -R "$APP_PATH" $GITHUB_WORKSPACE/Payload/
          
      - name: Package to IPA
        run: |
          cd $GITHUB_WORKSPACE
          zip -r "NRMN2AI.ipa" Payload/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NRMN2AI.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: "NRMN2AI iOS App v1.0.${{ github.run_number }}"
          body: "Standard www directory build for NRMN2AI trading journal."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
