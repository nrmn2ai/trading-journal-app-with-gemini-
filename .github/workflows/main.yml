name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate Xcode project if needed
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(find . -maxdepth 6 -name '*.xcodeproj' -print -quit)
          WORKSPACE=$(find . -maxdepth 6 -name '*.xcworkspace' \
            ! -path '*.xcodeproj/*' -print -quit)

          if [[ -z "$PROJECT" && -z "$WORKSPACE" ]]; then
            PROJECT_YML=$(find . -maxdepth 6 -name project.yml -print -quit)
            if [[ -z "$PROJECT_YML" ]]; then
              echo "Couldn't find an Xcode project, workspace, or project.yml."
              exit 1
            fi

            brew install xcodegen
            cd "$(dirname "$PROJECT_YML")"
            xcodegen generate
          fi

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(find . -maxdepth 6 -name '*.xcodeproj' -print -quit)
          WORKSPACE=$(find . -maxdepth 6 -name '*.xcworkspace' \
            ! -path '*.xcodeproj/*' -print -quit)

          if [[ -n "$WORKSPACE" ]]; then
            CONTAINER=(-workspace "$WORKSPACE")
          elif [[ -n "$PROJECT" ]]; then
            CONTAINER=(-project "$PROJECT")
          else
            echo "Couldn't find the generated Xcode project or workspace."
            exit 1
          fi

          SCHEME="${{ vars.IOS_SCHEME }}"
          if [[ -z "$SCHEME" ]]; then
            SCHEME=$(xcodebuild -list -json "${CONTAINER[@]}" |
              ruby -rjson -e '
                j = JSON.parse(STDIN.read)
                object = j["project"] || j["workspace"] || {}
                puts object.fetch("schemes", []).first
              ')
          fi

          if [[ -z "$SCHEME" ]]; then
            echo "Couldn't detect the Xcode scheme. Set IOS_SCHEME in repository variables."
            exit 1
          fi

          echo "Building scheme: $SCHEME"

          DERIVED="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            "${CONTAINER[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP=$(find "$DERIVED/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)

          if [[ -z "$APP" ]]; then
            echo "Build finished, but no .app was found."
            exit 1
          fi

          PACKAGE="$RUNNER_TEMP/ipa-package"
          mkdir -p "$PACKAGE/Payload"
          cp -R "$APP" "$PACKAGE/Payload/"

          cd "$PACKAGE"
          zip -qry "$GITHUB_WORKSPACE/unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-iphone-ipa
          path: unsigned.ipa
          if-no-files-found: error
          retention-days: 14
