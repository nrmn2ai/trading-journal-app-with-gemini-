name: Pure Swift iOS Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios-swift:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Xcodegen
        run: brew install xcodegen

      - name: Create Native Swift & SwiftUI Files
        run: |
          mkdir -p AppSource
          
          # انتقال امن تمام فایل‌های وب (HTML/JS/CSS/تصاویر) به پوشه منابع اپلیکیشن
          mkdir -p AppSource/WebAssets
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name 'AppSource' -exec cp -r {} AppSource/WebAssets/ \; 2>/dev/null || true
          
          # ساخت فایل اصلی اجرای اپلیکیشن با SwiftUI
          cat << 'EOF' > AppSource/NRMN2AIApp.swift
          import SwiftUI

          @main
          struct NRMN2AIApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF
          
          # ساخت مرورگر نیتیو اپل (WKWebView) برای اجرای ژورنال معاملاتی
          cat << 'EOF' > AppSource/ContentView.swift
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              func makeUIView(context: Context) -> WKWebView {
                  let webView = WKWebView()
                  // دادن دسترسی کامل برای خواندن فایل‌های لوکال (جلوگیری از صفحه سفید)
                  webView.configuration.preferences.setValue(true, forKey: "allowFileAccessFromFileURLs")
                  return webView
              }
              
              func updateUIView(_ uiView: WKWebView, context: Context) {
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "WebAssets") {
                      uiView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
              }
          }

          struct ContentView: View {
              var body: some View {
                  WebView()
                      .edgesIgnoringSafeArea(.all)
              }
          }
          EOF

      - name: Create Xcode Project using Xcodegen
        run: |
          cat << 'EOF' > project.yml
          name: NRMN2AI
          options:
            bundleIdPrefix: com.nrmn2ai
          targets:
            NRMN2AI:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: 
                - path: AppSource
              settings:
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGN_IDENTITY: ""
          EOF
          xcodegen generate

      - name: Build Pure Native iOS App
        run: |
          xcodebuild clean build -project NRMN2AI.xcodeproj -scheme NRMN2AI -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -R build/NRMN2AI.app Payload/
          zip -r "NRMN2AI-Swift.ipa" Payload/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NRMN2AI-Swift.ipa
          tag_name: v2.0.${{ github.run_number }}
          name: "Native Swift App v2.0.${{ github.run_number }}"
          body: "100% Native SwiftUI build. Goodbye Capacitor bugs!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
