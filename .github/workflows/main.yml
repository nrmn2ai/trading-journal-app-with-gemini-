name: Build iOS IPA & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Clean Web Directory
        run: |
          # ساخت پوشه موقت برای وب
          mkdir -p my-web-app
          
          # کپی کردن فقط فایل‌های وب اصلی به داخل آن
          cp index.html my-web-app/
          cp *.js my-web-app/ 2>/dev/null || true
          cp *.css my-web-app/ 2>/dev/null || true

      - name: Initialize Capacitor App
        run: |
          cd my-web-app
          npm init -y
          npm install @capacitor/core@5 @capacitor/ios@5 @capacitor/cli@5
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir .
          npx cap add ios

          # اصلاح نسخه پلتفرم به 14.0
          cd ios/App
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/g" Podfile
          pod install --repo-update

          # ساخت خروجی نهایی
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

          # انتقال فایل IPA به ریشه اصلی پروژه
          mkdir -p $GITHUB_WORKSPACE/output
          cp -R build/App.app $GITHUB_WORKSPACE/output/
          
      - name: Package to IPA
        run: |
          cd output
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r "$GITHUB_WORKSPACE/NRMN2AI.ipa" Payload/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NRMN2AI.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: "NRMN2AI iOS App v1.0.${{ github.run_number }}"
          body: "Clean isolated build for NRMN2AI trading journal app."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
