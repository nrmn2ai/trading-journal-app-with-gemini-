name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp -R * www/ 2>/dev/null || true
          rm -rf www/ios www/.github www/node_modules 2>/dev/null || true

      - name: Install Capacitor & Add Platform (No Pods)
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/ios@5 @capacitor/cli@5
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          
          # اضافه کردن پلتفرم بدون اجرای خودکار پادها برای جلوگیری از ارور
          npx cap add ios --no-pod-install

      - name: Force Fix Podfile & Run Pod Install
        run: |
          cd ios/App
          
          # بازنویسی کامل Podfile و تنظیم اجباری روی iOS 14.0
          cat << 'EOF' > Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '14.0'
          use_frameworks!

          target 'App' do
            capacitor_pods
          end

          post_install do |installer|
            capacitor_post_install(installer)
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end
            end
          end
          EOF
          
          # نصب دستی و موفقیت‌آمیز پادها روی تنظیمات جدید
          pod install --repo-update

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package to IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r ../../../NRMN2AI.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-App
          path: NRMN2AI.ipa
