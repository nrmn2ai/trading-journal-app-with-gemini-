name: Build Native iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios-native:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Swift Code & Prepare Assets
        run: |
          # 1. ساخت یک پوشه امن برای انتقال فایل‌های وب شما
          mkdir -p WebRoot
          cp index.html WebRoot/ 2>/dev/null || true
          cp *.js WebRoot/ 2>/dev/null || true
          cp *.css WebRoot/ 2>/dev/null || true
          cp *.png WebRoot/ 2>/dev/null || true
          cp *.gif WebRoot/ 2>/dev/null || true
          cp *.jpg WebRoot/ 2>/dev/null || true
          cp manifest.json WebRoot/ 2>/dev/null || true

          # 2. ساخت خودکار کدهای برنامه Swift (فایل JournalApp.swift)
          mkdir -p AppSource
          cat << 'EOF' > AppSource/JournalApp.swift
          import SwiftUI
          import WebKit

          @main
          struct JournalApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct WebView: UIViewRepresentable {
              func makeUIView(context: Context) -> WKWebView {
                  let webView = WKWebView()
                  // اعطای دسترسی به فایل‌های لوکال برای جلوگیری از صفحه سفید
                  webView.configuration.preferences.setValue(true, forKey: "allowFileAccessFromFileURLs")
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {
                  // خواندن فایل index.html از پوشه WebRoot
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "WebRoot") {
                      uiView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
              }
          }

          struct ContentView: View {
              var body: some View {
                  WebView().edgesIgnoringSafeArea(.all)
              }
          }
          EOF

      - name: Generate Xcode Project
        run: |
          # ساخت تنظیمات نیتیو اپل برای کامپایل بدون ارور
          cat << 'EOF' > project.yml
          name: TradingJournal
          options:
            bundleIdPrefix: com.nrmn2ai
          targets:
            TradingJournal:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources:
                - path: AppSource
                - path: WebRoot
                  type: folder
              settings:
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGN_IDENTITY: ""
          EOF
          xcodegen generate

      - name: Build App
        run: |
          xcodebuild clean build -project TradingJournal.xcodeproj -scheme TradingJournal -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/TradingJournal.app Payload/
          zip -r "NRMN2AI.ipa" Payload/

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: NRMN2AI.ipa
          tag_name: v4.0.${{ github.run_number }}
          name: "iOS App v4.0.${{ github.run_number }}"
          body: "Standalone Native SwiftUI Build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
