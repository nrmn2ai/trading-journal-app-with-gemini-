name: TradingJournal

options:
  bundleIdPrefix: com.nrmn2ai

targets:
  TradingJournal:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: AppSources/ContentView.swift
      - path: AppSources/GIFView.swift
      - path: AppSources/TradingJournalApp.swift
      - path: AppSources/Golden Bull Market Emblem.png
        buildPhase: resources
      - path: AppSources/Trading_candles_moving_together_20261006131456.gif
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nrmn2ai.tradingjournal
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
