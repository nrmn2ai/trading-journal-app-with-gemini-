<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Journal App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        h1 {
            color: #ffd700;
            margin-bottom: 30px;
        }
        .image-container {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Trading Journal</h1>

    <div class="image-container">
        <h2>Bull Market</h2>
        <img src="Golden Bull Market Emblem.png" alt="Golden Bull Market Emblem">
    </div>

    <div class="image-container">
        <h2>Market Movement</h2>
        <img src="Trading_candles_moving_together_20261006131456.gif" alt="Trading Candles Moving Together">
    </div>

    <div class="footer">
        Powered by Gemini AI
    </div>
</body>
</html>
