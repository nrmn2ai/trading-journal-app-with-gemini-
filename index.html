    <script>
      // AI Studio Sandbox: HMR is disabled via DISABLE_HMR. Suppress Vite HMR WebSocket disconnection errors.
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            var msg = (item && (item.message || String(item))) || '';
            if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('vite:ws') !== -1) {
              return;
            }
          }
          return origConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var msg = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          var PatchedWebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (protocols === 'vite-hmr' || urlStr.indexOf('vite-hmr') !== -1 || (urlStr.indexOf('ws') === 0 && urlStr.indexOf('run.app') !== -1 && urlStr.indexOf('tradingview') === -1)) {
              var dummy = {
                readyState: 1, // OPEN
                send: function() {},
                close: function() {},
                addEventListener: function(type, cb) {
                  if (type === 'open') {
                    setTimeout(cb, 20);
                  }
                },
                removeEventListener: function() {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              setTimeout(function() {
                if (typeof dummy.onopen === 'function') dummy.onopen({ type: 'open' });
              }, 20);
              return dummy;
            }
            return new OrigWebSocket(url, protocols);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
