name: Build iOS IPA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-ipa:
    # استفاده از سرورهای مکینتاش گیت‌هاب
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          mkdir www
          cp index.html www/
          cp logo.png www/ 2>/dev/null || :
          cp Trading_candles_moving_together_20261006131456.gif www/ 2>/dev/null || :

      - name: Install Capacitor & Create iOS Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "NRMN2AI" "com.nrmn2ai.terminal" --web-dir www
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned iOS App
        run: |
          cd ios/App
          # کامپایل اپلیکیشن بدون نیاز به اکانت پولی دولوپر اپل
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build CONFIGURATION_BUILD_DIR=$PWD/build
          
          # تبدیل خروجی به فایل IPA
          mkdir -p Payload
          cp -r build/App.app Payload/
          zip -r ../../NRMN2AI.ipa Payload

      - name: Upload IPA File for Download
        uses: actions/upload-artifact@v4
        with:
          name: NRMN2AI-iOS-App
          path: NRMN2AI.ipa
